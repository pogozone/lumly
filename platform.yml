manifestVersion: "1"

app:
  name: lumly
  displayName: Lumly
  version: "1.0.0"

docker:
  dockerfile: Dockerfile
  context: .

runtime:
  port: 3000
  healthcheck: /health

database:
  type: mariadb
  database: lumly

  urlEnvironmentVariable: DATABASE_URL
  nameEnvironmentVariable: DATABASE_NAME
  environmentPrefix: DATABASE_

environment:
  COOKIE_SECRET: ${LUMLY_COOKIE_SECRET}
  ADMIN_SETUP_TOKEN: ${LUMLY_ADMIN_SETUP_TOKEN}