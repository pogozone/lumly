services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-lumly}
      MARIADB_USER: ${DATABASE_USER:-lumly}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "3306:3306"

  lumly:
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_HOST: mariadb
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DATABASE_NAME:-lumly}
      DATABASE_USER: ${DATABASE_USER:-lumly}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env (>= 32 random chars)}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-90}
      GEO_ENABLED: ${GEO_ENABLED:-false}
      GEO_DB_PATH: ${GEO_DB_PATH:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
